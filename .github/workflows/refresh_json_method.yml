name: Daily refresh (JSON method)
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Setup service account credentials (JSON method)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          # Check if the secret exists and is not empty
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "ERROR: GOOGLE_CREDENTIALS_JSON secret is not set or is empty"
            exit 1
          fi

          # Write credentials directly to file (no base64 decoding needed)
          echo "$GOOGLE_CREDENTIALS_JSON" > $RUNNER_TEMP/sa.json

          # Set restrictive permissions
          chmod 600 $RUNNER_TEMP/sa.json

          # Verify the file was created securely and contains valid JSON
          if [ ! -f "$RUNNER_TEMP/sa.json" ]; then
            echo "ERROR: Credentials file was not created"
            exit 1
          fi

          # Validate JSON structure
          if ! python3 -m json.tool $RUNNER_TEMP/sa.json > /dev/null; then
            echo "ERROR: Credentials file does not contain valid JSON"
            exit 1
          fi

          echo "✓ Credentials file created successfully"
          ls -la $RUNNER_TEMP/sa.json
      - name: Run pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DAYS_LOOKBACK: "90"
          WEEKLY_BASELINE_WEEKS: "13"
          ENABLE_PERMITS: "true"
          ENABLE_CTA: "true"
        run: python -m src.main
